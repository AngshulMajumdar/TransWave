<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="70" y="80" font-size="46" font-weight="700" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>TransWave: Causal Multiscale Language Model</text>
<text x="70" y="122" font-size="22" fill="#475569" font-family='Inter,Segoe UI,Arial,sans-serif'>Current causal architecture used for the reported four-dataset experiment</text>
<rect x="70" y="280" rx="18" width="210" height="160" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="175.0" y="353.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>Raw UTF-8</text><text x="175.0" y="383.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>bytes</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><line x1="280" y1="360" x2="350" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="315.0" y="348.0" text-anchor="middle" font-size="18" fill="#475569" font-family='Inter,Segoe UI,Arial,sans-serif'>8-byte blocks</text><rect x="350" y="245" rx="18" width="250" height="230" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="475.0" y="338.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>Block-local</text><text x="475.0" y="368.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>learned lifting</text><text x="475.0" y="398.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>3 stages</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><line x1="600" y1="360" x2="680" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><rect x="680" y="245" rx="18" width="250" height="230" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="805.0" y="338.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>8 scales × 96</text><text x="805.0" y="368.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>channels</text><text x="805.0" y="398.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>D = 768</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><line x1="930" y1="360" x2="1010" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><rect x="1010" y="220" rx="18" width="250" height="280" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1135.0" y="338.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>12 causal</text><text x="1135.0" y="368.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>TransWave layers</text><text x="1135.0" y="398.0" text-anchor="middle" font-size="25" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>Meyer + local + FFN</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><line x1="1260" y1="360" x2="1330" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="1295.0" y="348.0" text-anchor="middle" font-size="18" fill="#475569" font-family='Inter,Segoe UI,Arial,sans-serif'>shift 1 block</text><rect x="1330" y="245" rx="18" width="200" height="230" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1430.0" y="338.0" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>8-byte</text><text x="1430.0" y="368.0" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>autoregressive</text><text x="1430.0" y="398.0" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>decoder</text><text x="800" y="650" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a" font-family='Inter,Segoe UI,Arial,sans-serif'>p(xₜ | x&lt;ₜ) — genuine causal next-byte likelihood</text><text x="800" y="700" text-anchor="middle" font-size="21" fill="#475569" font-family='Inter,Segoe UI,Arial,sans-serif'>32,768 raw bytes → 4,096 completed blocks; no future block enters the prediction context</text>
</svg>